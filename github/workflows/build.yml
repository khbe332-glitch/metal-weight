name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project
        run: |
          flutter create --platforms=android --project-name metal_weight out
          cp app/pubspec.yaml out/pubspec.yaml
          cp app/lib/*.dart out/lib/
      - name: Build APK
        working-directory: out
        run: |
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: metal-weight-apk
          path: out/build/app/outputs/flutter-apk/app-release.apk
